  # APPLICATION LAYER - MICROSERVICES (Placeholder - Uncomment when ready)

  service-rust:
    build:
      context: ./apps/service-rust
      dockerfile: Dockerfile.dev
    container_name: atlas-service-rust
    restart: no
    environment:
      - DATABASE_URL=postgresql://admin:password@pgbouncer-nfl:5432/nfl_data
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./apps/service-rust:/app
      - /app/target
    ports:
      - '8001:8001'
    networks:
      - atlas-network
    depends_on:
      redis:
        condition: service_started
      pgbouncer-nfl:
        condition: service_started
      postgres-nfl:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.service-rust.rule=Host(`rust-service.localhost`)'
      - 'traefik.http.routers.service-rust.entrypoints=web'
      - 'traefik.http.services.service-rust.loadbalancer.server.port=8001'

  service-go:
    build:
      context: ./apps/service-go
      dockerfile: Dockerfile.dev
    container_name: atlas-service-go
    restart: unless-stopped
    ports:
      - '8002:8002'
    volumes:
      - ./apps/service-go:/app
      - /app/gridstream/tmp
    environment:
      - PORT=8002
      - REDIS_URL=redis://redis:6379/0
      - POLL_IN_GAME_SECONDS=8
      - POLL_PRE_GAME_SECONDS=60
      - POLL_POST_GAME_SECONDS=300
      - SIM_DEFAULT_SPEED=5
    networks:
      - atlas-network
    depends_on:
      - redis
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8002/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.service-go.rule=Host(`go-service.localhost`)'
      - 'traefik.http.routers.service-go.entrypoints=web'
      - 'traefik.http.services.service-go.loadbalancer.server.port=8002'
      - 'traefik.http.routers.service-go.middlewares=cors@docker'

