networks:
  atlas-network:
    driver: bridge
    name: atlas-network

volumes:
  postgres-atlas-data:
    name: atlas-postgres-data
  postgres-nfl-data:
    name: atlas-nfl-postgres-data
  postgres-nfl-v2-data:
    name: atlas-nfl-v2-postgres-data
  redis-data:
    name: atlas-redis-data
  minio-data:
    name: atlas-minio-data
  django-static:
    name: atlas-django-static
  playwright-cache:
    name: atlas-playwright-cache
