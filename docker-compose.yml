services:
  postgres-atlas:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: atlas_password
      POSTGRES_DB: atlas_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-atlas-data:/var/lib/postgresql/data
    networks:
      - atlas-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas_user -d atlas_db']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-nfl:
    image: postgres:15-alpine
    container_name: atlas-nfl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nfl_data
    ports:
      - '5433:5432'
    volumes:
      - postgres-nfl-data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d
    networks:
      - atlas-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d nfl_data']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-nfl-v2:
    image: postgres:15-alpine
    container_name: atlas-nfl-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nfl_data_v2
    ports:
      - '5434:5432'
    volumes:
      - postgres-nfl-v2-data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d
    networks:
      - atlas-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d nfl_data_v2']
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer-atlas:
    image: edoburu/pgbouncer
    container_name: atlas-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: atlas_user
      DB_PASSWORD: atlas_password
      DB_HOST: postgres-atlas
      DB_NAME: atlas_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - '6432:5432'
    networks:
      - atlas-network
    depends_on:
      postgres-atlas:
        condition: service_healthy

  pgbouncer-nfl:
    image: edoburu/pgbouncer
    container_name: atlas-nfl-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: admin
      DB_PASSWORD: password
      DB_HOST: postgres-nfl
      DB_NAME: nfl_data
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - '6433:5432'
    networks:
      - atlas-network
    depends_on:
      postgres-nfl:
        condition: service_healthy

  pgbouncer-nfl-v2:
    image: edoburu/pgbouncer
    container_name: atlas-nfl-v2-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: admin
      DB_PASSWORD: password
      DB_HOST: postgres-nfl-v2
      DB_NAME: nfl_data_v2
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - '6434:5432'
    networks:
      - atlas-network
    depends_on:
      postgres-nfl-v2:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - atlas-network
    command: redis-server --appendonly yes

  minio:
    image: minio/minio
    container_name: atlas-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: atlas_admin
      MINIO_ROOT_PASSWORD: atlas_password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - atlas-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.minio-static.rule=PathPrefix(`/player-ras/`)'
      - 'traefik.http.routers.minio-static.entrypoints=web'
      - 'traefik.http.services.minio-static.loadbalancer.server.port=9000'

  traefik:
    image: traefik:v2.10
    container_name: atlas-traefik
    restart: unless-stopped
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - atlas-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=http://localhost:3000,http://app.localhost,http://angular.localhost,http://vue.localhost,http://svelte.localhost'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowheaders=*'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowcredentials=true'
      - 'traefik.http.middlewares.cors.headers.accesscontrolmaxage=100'

  api-django:
    build:
      context: ./apps/api-django
      dockerfile: Dockerfile.dev
    container_name: atlas-api-django
    restart: unless-stopped
    environment:
      - DEBUG=True
      - LAN_DEV_HOST=${LAN_DEV_HOST:-}
      - DATABASE_URL=postgresql://atlas_user:atlas_password@pgbouncer-atlas:5432/atlas_db
      - NFL_DATABASE_URL=postgresql://admin:password@pgbouncer-nfl-v2:5432/nfl_data_v2
      - NFL_DATABASE_V1_URL=postgresql://admin:password@pgbouncer-nfl:5432/nfl_data
      - NFL_DATABASE_V2_URL=postgresql://admin:password@pgbouncer-nfl-v2:5432/nfl_data_v2
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost
      - MINIO_ACCESS_KEY=atlas_admin
      - MINIO_SECRET_KEY=atlas_password
    volumes:
      - ./apps/api-django:/app
      - django-static:/app/staticfiles
      - /app/.venv
      - ./packages/db/seeds:/app/seeds
      - playwright-cache:/root/.cache/ms-playwright
    ports:
      - '8000:8000'
    networks:
      - atlas-network
    depends_on:
      pgbouncer-atlas:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8000/admin/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`api.localhost`)'
      - 'traefik.http.routers.api.entrypoints=web'
      - 'traefik.http.services.api.loadbalancer.server.port=8000'
      - 'traefik.http.routers.api.middlewares=cors@docker'

  api-celery-worker:
    build:
      context: ./apps/api-django
      dockerfile: Dockerfile.dev
    container_name: atlas-api-celery
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      - DEBUG=True
      - LAN_DEV_HOST=${LAN_DEV_HOST:-}
      - DATABASE_URL=postgresql://atlas_user:atlas_password@pgbouncer-atlas:5432/atlas_db
      - NFL_DATABASE_URL=postgresql://admin:password@pgbouncer-nfl-v2:5432/nfl_data_v2
      - NFL_DATABASE_V1_URL=postgresql://admin:password@pgbouncer-nfl:5432/nfl_data
      - NFL_DATABASE_V2_URL=postgresql://admin:password@pgbouncer-nfl-v2:5432/nfl_data_v2
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost
      - MINIO_ACCESS_KEY=atlas_admin
      - MINIO_SECRET_KEY=atlas_password
    volumes:
      - ./apps/api-django:/app
      - django-static:/app/staticfiles
      - /app/.venv
      - ./packages/db/seeds:/app/seeds
      - playwright-cache:/root/.cache/ms-playwright
    networks:
      - atlas-network
    depends_on:
      pgbouncer-atlas:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  web-next:
    build:
      context: .
      dockerfile: ./apps/web-next/Dockerfile.dev
    container_name: atlas-web-next
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api.localhost/api}
      - NODE_ENV=development
    volumes:
      - ./apps/web-next:/app/apps/web-next
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web-next/node_modules
      - /app/apps/web-next/.next
    ports:
      - '3000:3000'
    networks:
      - atlas-network
    depends_on:
      api-django:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.web-next.rule=Host(`app.localhost`)'
      - 'traefik.http.routers.web-next.entrypoints=web'
      - 'traefik.http.services.web-next.loadbalancer.server.port=3000'

