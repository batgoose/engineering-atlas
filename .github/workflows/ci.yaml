name: Atlas CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  systems-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Diagnostics
        run: |
          echo "Atlas CI/CD Pipeline: ONLINE"
          echo "Commit: ${{ github.sha }}"

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: atlas_test_db
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./apps/api-django

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: 'False'
      DATABASE_URL: 'postgres://atlas_user:password@localhost:5432/atlas_test_db'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --no-interaction --no-root

      - name: Run Integration Tests
        run: poetry run python manage.py test core

  rust-ingestor-tests:
    name: Rust Ingestor Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nfl_data
        ports:
          # CRITICAL: Map host 5433 to container 5432
          # This tricks the runner into looking like my local setup
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./apps/service-rust/nflreadrust

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # cache dependencies (speeds up builds by 500%+)
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/service-rust/nflreadrust

      - name: Apply SQL Schema
        run: |
          sudo apt-get install -y postgresql-client
          # Connect to port 5433 and run the schema file from packages/db/init
          psql "postgres://admin:password@localhost:5433/nfl_data" -f ../../../packages/db/init/01_schema.sql

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run Cargo Test
        run: cargo test
