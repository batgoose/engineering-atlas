name: Atlas CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  systems-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Diagnostics
        run: |
          echo "Atlas CI/CD Pipeline: ONLINE"
          echo "Commit: ${{ github.sha }}"

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atlas_db
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: atlas_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-nfl:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nfl_data
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./apps/api-django

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install UV
        run: pip install uv

      - name: Create .env file
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci-pipeline" > .env
          echo "DEBUG=True" >> .env
          echo "DATABASE_URL=postgresql://atlas_user:atlas_password@localhost:5432/atlas_db" >> .env
          echo "NFL_DATABASE_URL=postgresql://admin:password@localhost:5433/nfl_data" >> .env

      - name: Install Dependencies
        run: |
          uv pip install --system \
            "django>=5.2.11,<6.0" \
            "djangorestframework>=3.16.1,<4.0.0" \
            "django-environ>=0.12.0,<0.13.0" \
            "psycopg[binary]>=3.3.2,<4.0.0" \
            "drf-spectacular>=0.29.0,<0.30.0" \
            "markdown>=3.10.2,<4.0.0" \
            "django-filter>=25.2,<26.0" \
            "django-cors-headers>=4.9.0,<5.0.0" \
            "requests>=2.32.5,<3.0.0" \
            "redis>=7.1.1,<8.0.0" \
            "black>=26.1.0,<27.0.0" \
            "pytest>=9.0.2,<10.0.0" \
            "pytest-django>=4.11.1,<5.0.0"

      - name: Run Migrations
        env:
          CI: 'true'
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --database=nfl --noinput

      - name: Run Backend Tests
        env:
          CI: 'true'
        run: pytest -v

  rust-ingestor-tests:
    name: Rust Ingestor Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nfl_data
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./apps/service-rust/nflreadrust

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/service-rust/nflreadrust

      - name: Apply SQL Schema
        run: |
          sudo apt-get install -y postgresql-client
          psql "postgres://admin:password@localhost:5433/nfl_data" -f ../../../packages/db/init/01_schema.sql

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Run Tests
        run: cargo test

  go-tests:
    name: Go Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/service-go/gridstream

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/service-go/gridstream/go.mod
          cache: true

      - name: Run Tests
        run: go test ./... -v -race -count=1

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/service-go/gridstream
          args: --timeout=5m

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run JS/TS Lint
        run: pnpm lint

      - name: Run Next.js Tests
        run: pnpm --filter @atlas/web-next test

      - name: Run UI Package Tests
        run: pnpm --filter @atlas/ui test

      - name: Run SDK Package Tests
        run: pnpm --filter @atlas/web-next exec vitest --root ../.. run packages/sdk/src/__tests__

  format-check:
    name: Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Black
        run: pip install "black>=26.1.0,<27.0.0"

      - name: Check Python Formatting
        run: black --check apps/api-django

      - name: Install JS Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JS/TS Formatting
        run: pnpm exec prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}" --ignore-path .gitignore
