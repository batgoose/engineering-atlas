[package]
name = "nflreadrust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }

# HTTP Client (with stream support for large files)
reqwest = { version = "0.11", features = ["stream", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }

csv = "1.3"

# Database (Postgres)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }

anyhow = "1.0"
futures-util = "0.3.31"
chrono = "0.4.43"
